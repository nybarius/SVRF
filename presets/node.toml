# A Node project. Lockfiles are regenerated by `npm ci`, so they are not union-merged:
# a lockfile conflict holds the pull request for its author to regenerate.
repo = "your-org/your-repo"
clone = "/var/lib/svrf/clone"
state_dir = "/var/lib/svrf/state"

[gate]
setup = ["npm ci --prefer-offline --no-audit"]
commands = ["npm test --silent"]
failing_pattern = "(✕|FAIL|Error:)"

[repair]
union_merge = ["CHANGELOG.md"]
