<rect width="1179" height="813" rx="12" fill="#161615"/>
<rect width="1179" height="34" rx="12" fill="#232321"/><rect y="22" width="1179" height="12" fill="#232321"/>
<circle cx="22" cy="17" r="6" fill="#ec6a5e"/><circle cx="42" cy="17" r="6" fill="#f4bf4f"/><circle cx="62" cy="17" r="6" fill="#61c554"/>
<text class="title" x="590" y="21" text-anchor="middle">SVRF demo: a braided train landing eight pull requests</text>
<text class="l n0 cmd" x="22" y="64" xml:space="preserve"><tspan class="prompt">$</tspan> python3 demo/run_demo.py</text>
<text class="l n1 out" x="22" y="83" xml:space="preserve"></text>
<text class="l n2 head" x="22" y="102" xml:space="preserve">== Six agents open eight pull requests against the toy project ==</text>
<text class="l n3 out" x="22" y="121" xml:space="preserve">  #1 'Add subtract' (ada): ordinary feature</text>
<text class="l n4 out" x="22" y="140" xml:space="preserve">  #2 'Add multiply' (bo): ordinary feature (parent of a stacked PR)</text>
<text class="l n5 out" x="22" y="159" xml:space="preserve">  #3 'Set mode to safe' (cy): changes MODE</text>
<text class="l n6 out" x="22" y="178" xml:space="preserve">  #4 'Set mode to turbo' (di): changes MODE too: conflicts</text>
<text class="l n7 out" x="22" y="197" xml:space="preserve">  #5 'Add divide' (ed): its own test fails</text>
<text class="l n8 out" x="22" y="216" xml:space="preserve">  #6 'Add power' (fay): code committed before its test</text>
<text class="l n9 out" x="22" y="235" xml:space="preserve">  #7 'Add square' (bo): stacked on #2 (bo/multiply)</text>
<text class="l n10 out" x="22" y="254" xml:space="preserve">  #8 'Add negate' (ada): ordinary feature</text>
<text class="l n11 out" x="22" y="273" xml:space="preserve"></text>
<text class="l n12 head" x="22" y="292" xml:space="preserve">== Configuring the train (the gate is the toy project's own unit tests) ==</text>
<text class="l n13 out" x="22" y="311" xml:space="preserve"></text>
<text class="l n14 head" x="22" y="330" xml:space="preserve">== Running the train, one round per tick, until it goes idle ==</text>
<text class="l n15 ok" x="22" y="349" xml:space="preserve">  tick 1: RAN; merged #1, #2, #3, #8; held #5; relanded #6 -&gt; #9</text>
<text class="l n16 ok" x="22" y="368" xml:space="preserve">  tick 2: RAN; held #4; repaired #9; retargeted #7</text>
<text class="l n17 ok" x="22" y="387" xml:space="preserve">  tick 3: RAN; merged #9; repaired #7</text>
<text class="l n18 ok" x="22" y="406" xml:space="preserve">  tick 4: RAN; repaired #7</text>
<text class="l n19 ok" x="22" y="425" xml:space="preserve">  tick 5: RAN; merged #7</text>
<text class="l n20 ok" x="22" y="444" xml:space="preserve">  tick 6: IDLE</text>
<text class="l n21 out" x="22" y="463" xml:space="preserve"></text>
<text class="l n22 head" x="22" y="482" xml:space="preserve">== Done: what landed, what's still held ==</text>
<text class="l n23 out" x="22" y="501" xml:space="preserve">PR  agent  title              what the agent did                         result      detail</text>
<text class="l n24 out" x="22" y="520" xml:space="preserve">--  -----  -----------------  -----------------------------------------  ----------  ------------------------------------------------------------</text>
<text class="l n25 row" x="22" y="539" xml:space="preserve">#1  ada    Add subtract       ordinary feature                           merged      round 1</text>
<text class="l n26 row" x="22" y="558" xml:space="preserve">#2  bo     Add multiply       ordinary feature (parent of a stacked PR)  merged      round 1</text>
<text class="l n27 row" x="22" y="577" xml:space="preserve">#3  cy     Set mode to safe   changes MODE                               merged      round 1</text>
<text class="l n28 held" x="22" y="596" xml:space="preserve">#4  di     Set mode to turbo  changes MODE too: conflicts                held        ADMISSION_HELD: merge:CONFLICT:tests/test_settings.py</text>
<text class="l n29 held" x="22" y="615" xml:space="preserve">#5  ed     Add divide         its own test fails                         held        GATE_RED: FAIL: test_divide (test_divide.Divide.test_divide)</text>
<text class="l n30 row" x="22" y="634" xml:space="preserve">#6  fay    Add power          code committed before its test             superseded  re-landed in order as #9</text>
<text class="l n31 row" x="22" y="653" xml:space="preserve">#7  bo     Add square         stacked on #2 (bo/multiply)                merged      round 5</text>
<text class="l n32 row" x="22" y="672" xml:space="preserve">#8  ada    Add negate         ordinary feature                           merged      round 1</text>
<text class="l n33 row" x="22" y="691" xml:space="preserve">#9  svrf   Add power          opened by the train for #6                 merged      round 3</text>
<text class="l n34 out" x="22" y="710" xml:space="preserve"></text>
<text class="l n35 ok" x="22" y="729" xml:space="preserve">rounds: 6   gates run: 6   merges: 5   landed tree == gated tree for every merge: True   wall: 1.2 s</text>
<text class="l n36 out" x="22" y="748" xml:space="preserve">repaired by union merge (CHANGELOG.md): #7, #9</text>
<text class="l n37 out" x="22" y="767" xml:space="preserve">retargeted to main after the parent merged: #7</text>
<text class="l n38 out" x="22" y="786" xml:space="preserve">left out of a round for a pairwise conflict: #4</text>
</svg>
