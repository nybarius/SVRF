name: release

# Builds and publishes on a version tag only (vX.Y.Z). Pull requests and ordinary pushes
# to main build everything but push nothing (see the `if:` guards below), so this
# workflow doubles as a build check without needing a tag.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  release-container:
    name: container (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Compute image tags
        id: tags
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "tags<<EOF"
            echo "ghcr.io/nybarius/svrf:${version}"
            echo "ghcr.io/nybarius/svrf:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build (and push on a tag; otherwise load into the local daemon to smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          load: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ startsWith(github.ref, 'refs/tags/v') && steps.tags.outputs.tags || 'svrf:build-check' }}
      - name: Smoke test the built image
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: docker run --rm --entrypoint svrf svrf:build-check --version

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --quiet build
          python -m build
      - name: Install the built wheel in a fresh venv and smoke test it
        run: |
          python -m venv /tmp/svrf-venv
          /tmp/svrf-venv/bin/pip install --quiet dist/svrf-*.whl
          /tmp/svrf-venv/bin/svrf --version
      - uses: actions/upload-artifact@v4
        with:
          name: svrf-dist
          path: dist/

  publish-pypi:
    name: publish (PyPI trusted publishing)
    needs: wheel
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/svrf/
    permissions:
      id-token: write # required for PyPI trusted publishing (OIDC); no token/secret needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: svrf-dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
